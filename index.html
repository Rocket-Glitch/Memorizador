<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario de química</title>
</head>

<body>

<h2 id="pregunta"></h2>

<div id="opciones"></div>

<p id="resultado"></p>

<button id="siguiente" hidden>Siguiente pregunta</button>

<script>

const elementos = `
Hidrógeno, Helio, Litio, Berilio, Boro, Carbono, Nitrógeno, Oxígeno, Flúor, Neón, Sodio, Magnesio, Aluminio, Silicio, Fósforo, Azufre, Cloro, Argón, Potasio, Calcio, Escandio, Titanio, Vanadio, Cromo,
Manganeso, Hierro, Cobalto, Níquel, Cobre, Zinc, Galio, Germanio, Arsénico, Selenio, Bromo, Kriptón, Rubidio, Estroncio, Itrio, Zirconio, Niobio, Molibdeno,
Tecnecio, Rutenio, Rodio, Paladio, Plata, Cadmio, Indio, Estaño, Antimonio, Telurio, Yodo, Xenón, Cesio, Bario, Lantano, Cerio, Praseodimio, Neodimio, Prometio, Samario, Europio, Gadolinio, Terbio, Disprosio,
Holmio, Erbio, Tulio, Iterbio, Lutecio, Hafnio, Tantalio, Wolframio, Renio, Osmio, Iridio, Platino, Oro, Mercurio, Talio, Plomo, Bismuto, Polonio, Ástato, Radón, Francio, Radio, Actinio, Torio,
Protactinio, Uranio, Neptunio, Plutonio, Americio, Curio, Berkelio, Californio, Einstenio, Fermio, Mendelevio, Nobelio,
Laurencio, Rutherfordio, Dubnio, Seaborgio, Bohrio, Hasio, Meitnerio, Darmstadtio, Roentgenio, Copernicio, Nihonio,
Flerovio, Moscovio, Livermorio, Teneso, Oganesón
`.split(",").map(e => e.trim());

let orden = [];
let actual;
let correcta;

function mezclar(lista) {
    let copia = [...lista];

    for (let i = copia.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
    }

    return copia;
}

function nuevaPregunta() {

    if (orden.length === 0) {
        orden = mezclar(elementos.map((nombre, i) => ({
            nombre,
            numero: i + 1
        })));
    }

    actual = orden.pop();

    let preguntarElemento = Math.random() < 0.5;

    correcta = preguntarElemento
        ? actual.nombre
        : String(actual.numero);

    document.getElementById("pregunta").textContent =
        preguntarElemento
        ? `¿Qué elemento tiene el número atómico ${actual.numero}?`
        : `¿Cuál es el número atómico del ${actual.nombre}?`;

    document.getElementById("resultado").textContent = "";

    document.getElementById("siguiente").hidden = true;

    let distractores = elementos
        .map((nombre, i) => preguntarElemento ? nombre : String(i + 1))
        .filter(opcion => opcion !== correcta);

    let opciones = mezclar([
        correcta,
        ...mezclar(distractores).slice(0, 4)
    ]);

    let contenedor = document.getElementById("opciones");
    contenedor.innerHTML = "";

    opciones.forEach(opcion => {

        let boton = document.createElement("button");

        boton.textContent = opcion;

        boton.onclick = () => comprobar(opcion);

        contenedor.appendChild(boton);
    });
}

function comprobar(respuesta) {

    document.querySelectorAll("#opciones button").forEach(boton => {
        boton.disabled = true;
    });

    document.getElementById("resultado").textContent =
        respuesta === correcta
        ? "¡Correcto! 🎉"
        : `Incorrecto. La respuesta era ${correcta}.`;

    document.getElementById("siguiente").hidden = false;
}

document.getElementById("siguiente").onclick = nuevaPregunta;

nuevaPregunta();

</script>

</body>
</html>
