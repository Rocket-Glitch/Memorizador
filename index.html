// 2. VARIABLES

let orden = [];
let actual;
let correcta;
let puntos = 0;
let numeroPregunta = 0;

// 3. FUNCION PARA MEZCLAR

function mezclar(lista) {

    let copia = [...lista];

    for (let i = copia.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [copia[i], copia[j]] = [copia[j], copia[i]];
    }

    return copia;
}

// 4. CREAR UNA NUEVA PREGUNTA

function nuevaPregunta() {

    if (orden.length === 0) {
        finalizarQuiz();
        return;
    }

    actual = orden.pop();

    numeroPregunta++;

    let tipo = Math.floor(Math.random() * 3);

    if (tipo === 0) {

        correcta = actual.nombre;

        document.getElementById("pregunta").textContent =
            `¿Qué elemento tiene el número atómico ${actual.numero}?`;

    } else if (tipo === 1) {

        correcta = actual.simbolo;

        document.getElementById("pregunta").textContent =
            `¿Cuál es el símbolo químico del ${actual.nombre}?`;

    } else {

        correcta = String(actual.numero);

        document.getElementById("pregunta").textContent =
            `¿Cuál es el número atómico del ${actual.nombre}?`;
    }

    document.getElementById("resultado").textContent = "";

    document.getElementById("siguiente").hidden = true;

    document.getElementById("progreso").textContent =
        `Pregunta ${numeroPregunta} de 118`;

    // 5. CREAR LAS ALTERNATIVAS

    let distractores;

    if (tipo === 0) {
        distractores = elementos.map(e => e.nombre);
    } else if (tipo === 1) {
        distractores = elementos.map(e => e.simbolo);
    } else {
        distractores = elementos.map(e => String(e.numero));
    }

    distractores = distractores.filter(opcion => opcion !== correcta);

    let opciones = mezclar([
        correcta,
        ...mezclar(distractores).slice(0, 4)
    ]);

    let contenedor = document.getElementById("opciones");

    contenedor.innerHTML = "";

    opciones.forEach(opcion => {

        let boton = document.createElement("button");

        boton.textContent = opcion;

        boton.onclick = () => comprobar(opcion, boton);

        contenedor.appendChild(boton);

    });
}

// 6. COMPROBAR LA RESPUESTA

function comprobar(respuesta, botonElegido) {

    let botones = document.querySelectorAll("#opciones button");

    botones.forEach(boton => {

        boton.disabled = true;

        if (boton.textContent === correcta) {
            boton.style.backgroundColor = "green";
            boton.style.color = "white";
        }

    });

    if (respuesta === correcta) {

        puntos++;

        document.getElementById("resultado").textContent =
            "¡Correcto!";

    } else {

        botonElegido.style.backgroundColor = "red";
        botonElegido.style.color = "white";

        document.getElementById("resultado").textContent =
            `Incorrecto. La respuesta era ${correcta}.`;
    }

    document.getElementById("puntos").textContent =
        `Puntos: ${puntos}`;

    document.getElementById("siguiente").hidden = false;
}

// 7. FINALIZAR EL QUIZ

function finalizarQuiz() {

    document.getElementById("pregunta").textContent =

    document.getElementById("opciones").innerHTML = "";

    document.getElementById("resultado").textContent =

    document.getElementById("progreso").textContent =
        "Completaste los 118 elementos.";

    document.getElementById("siguiente").textContent =
        "Volver a jugar";

    document.getElementById("siguiente").hidden = false;

    document.getElementById("siguiente").onclick = reiniciar;
}

// 8. REINICIAR EL QUIZ

function reiniciar() {

    puntos = 0;
    numeroPregunta = 0;

    document.getElementById("puntos").textContent = "Puntos: 0";

    document.getElementById("siguiente").textContent =
        "Siguiente pregunta";

    document.getElementById("siguiente").onclick = nuevaPregunta;

    orden = mezclar([...elementos]);

    nuevaPregunta();
}
