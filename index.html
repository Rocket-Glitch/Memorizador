<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Los 118 Elementos Químicos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .quiz-container {
            width: 100%;
            max-width: 640px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .quiz-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .score-badge {
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 999px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #7c3aed);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .question-text .highlight {
            color: var(--primary);
        }

        .options {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            width: 100%;
            padding: 16px 20px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #eff6ff;
            transform: translateY(-1px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option-btn.correct {
            border-color: var(--correct);
            background: #f0fdf4;
            color: var(--correct);
        }

        .option-btn.incorrect {
            border-color: var(--incorrect);
            background: #fef2f2;
            color: var(--incorrect);
        }

        .option-btn.correct::after {
            content: ' ✓';
            font-weight: 700;
        }

        .option-btn.incorrect::after {
            content: ' ✗';
            font-weight: 700;
        }

        .feedback {
            min-height: 28px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 16px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .feedback.visible {
            opacity: 1;
        }

        .feedback.correct {
            color: var(--correct);
        }

        .feedback.incorrect {
            color: var(--incorrect);
        }

        .btn-next {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-next:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Pantalla de resultados */
        .results-screen {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .results-screen.active {
            display: block;
        }

        .results-screen .emoji {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .results-screen h2 {
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        .results-screen .final-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;
        }

        .results-screen .message {
            color: var(--text-light);
            margin-bottom: 24px;
            font-size: 1rem;
        }

        .btn-restart {
            padding: 14px 32px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-restart:hover {
            background: var(--primary-dark);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .quiz-container {
                padding: 20px;
            }
            .question-text {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 14px 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quizContainer">
    <!-- Cabecera -->
    <div class="quiz-header">
        <h1>⚗️ Los 118 Elementos</h1>

        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <button class="btn-next" id="btnNext" disabled>Siguiente →</button>

    <!-- Pantalla de resultados -->
    <div class="results-screen" id="resultsScreen">

        <h2>¡Quiz completado!</h2>

    // ============================================================
    // 2. ESTADO DEL QUIZ
    // ============================================================
    let currentIndex = 0;          // Índice de la pregunta actual (0 a 117)
    let score = 0;                 // Respuestas correctas
    let answered = false;          // Si la pregunta actual ya fue respondida
    let quizFinished = false;      // Si el quiz terminó

    // Referencias del DOM
    const dom = {
        questionNumber: document.getElementById('questionNumber'),
        questionText: document.getElementById('questionText'),
        optionsContainer: document.getElementById('optionsContainer'),
        feedback: document.getElementById('feedback'),
        btnNext: document.getElementById('btnNext'),
        progressFill: document.getElementById('progressFill'),
        scoreBadge: document.getElementById('scoreBadge'),
        quizContent: document.getElementById('quizContent'),
        resultsScreen: document.getElementById('resultsScreen'),
        finalScore: document.getElementById('finalScore'),
        resultsMessage: document.getElementById('resultsMessage'),
        resultsEmoji: document.getElementById('resultsEmoji'),
        btnRestart: document.getElementById('btnRestart')
    };

    // ============================================================
    // 3. UTILIDADES
    // ============================================================
    function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    /**
     * Genera 3 distractores aleatorios del mismo tipo (símbolo o nombre)
     * que el elemento correcto, excluyendo el elemento actual.
     */
    function getDistractors(correctElement, type) {
        const pool = ELEMENTS.filter(el => el.symbol !== correctElement.symbol);
        const shuffled = shuffle(pool);
        const distractors = shuffled.slice(0, 3).map(el => type === 'symbol' ? el.symbol : el.name);
        // Si por alguna razón hay menos de 3 (no debería), rellenamos con genéricos
        while (distractors.length < 3) {
            distractors.push(type === 'symbol' ? '??' : 'Desconocido');
        }
        return distractors;
    }

    /**
     * Genera una pregunta para el elemento en el índice dado.
     * Alterna el tipo de pregunta: símbolo → nombre, nombre → símbolo.
     */
    function generateQuestion(index) {
        const element = ELEMENTS[index];
        // Alternar tipo de pregunta según el índice (par: símbolo; impar: nombre)
        const askForSymbol = index % 2 === 0;

        let questionTextHTML;
        let correctAnswer;
        let options;

        if (askForSymbol) {
            // Pregunta: ¿Cuál es el símbolo del [Nombre]?
            questionTextHTML = `¿Cuál es el símbolo del <span class="highlight">${element.name}</span>?`;
            correctAnswer = element.symbol;
            const distractors = getDistractors(element, 'symbol');
            options = shuffle([correctAnswer, ...distractors]);
        } else {
            // Pregunta: ¿Cuál es el nombre del elemento con símbolo [Símbolo]?
            questionTextHTML = `¿Cuál es el nombre del elemento con símbolo <span class="highlight">${element.symbol}</span>?`;
            correctAnswer = element.name;
            const distractors = getDistractors(element, 'name');
            options = shuffle([correctAnswer, ...distractors]);
        }

        return { element, askForSymbol, questionTextHTML, correctAnswer, options };
    }

    // ============================================================
    // 4. RENDERIZADO
    // ============================================================
    function renderQuestion() {
        answered = false;
        dom.feedback.textContent = '';
        dom.feedback.className = 'feedback';
        dom.btnNext.disabled = true;

        const q = generateQuestion(currentIndex);
        const total = ELEMENTS.length;

        // Número de pregunta
        dom.questionNumber.textContent = `Pregunta ${currentIndex + 1} de ${total}`;

        // Texto de la pregunta
        dom.questionText.innerHTML = q.questionTextHTML;

        // Opciones
        dom.optionsContainer.innerHTML = '';
        q.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = option;
            btn.dataset.value = option;
            btn.addEventListener('click', () => handleAnswer(btn, option, q.correctAnswer));
            dom.optionsContainer.appendChild(btn);
        });

        // Actualizar barra de progreso
        const progress = ((currentIndex) / total) * 100;
        dom.progressFill.style.width = `${progress}%`;

        // Actualizar badge de puntuación
        dom.scoreBadge.textContent = `${score} / ${currentIndex}`;
    }

    // ============================================================
    // 5. LÓGICA DE RESPUESTA
    // ============================================================
    function handleAnswer(selectedBtn, selectedValue, correctAnswer) {
        if (answered) return; // Evitar doble respuesta
        answered = true;

        const allButtons = dom.optionsContainer.querySelectorAll('.option-btn');
        allButtons.forEach(btn => {
            btn.disabled = true;
            if (btn.dataset.value === correctAnswer) {
                btn.classList.add('correct');
            }
        });

        const isCorrect = selectedValue === correctAnswer;

        if (isCorrect) {
            score++;
            dom.feedback.textContent = '✅ ¡Correcto!';
            dom.feedback.className = 'feedback visible correct';
        } else {
            selectedBtn.classList.add('incorrect');
            dom.feedback.textContent = `❌ Incorrecto. La respuesta correcta era: ${correctAnswer}`;
            dom.feedback.className = 'feedback visible incorrect';
        }

        // Actualizar badge
