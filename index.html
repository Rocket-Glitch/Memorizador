    <title>Cluster 11</title>

    <p>Pregunta: <span id="numero">1</span> de 118</p>

    <p>Precisión: <span id="precision">0</span>%</p>

    <button id="siguiente" onclick="siguientePregunta()" disabled>
        Siguiente pregunta
    </button>

<button onclick="reiniciar()">Reiniciar
</button>

            ["Oganesón", "Og"]
        ];


        // 2. VARIABLES DEL JUEGO

        let puntos = 0;

        let numeroPregunta = 0;

        let respuestaCorrecta = "";

        let preguntas = [];


        // 3. OBTENER UN ELEMENTO HTML

        function buscar(id) {

            return document.getElementById(id);

        }


        // 4. MEZCLAR LOS ELEMENTOS

        function mezclar(lista) {

            let copia = [...lista];

            for (let i = copia.length - 1; i > 0; i--) {

                let j = Math.floor(Math.random() * (i + 1));

                [copia[i], copia[j]] = [copia[j], copia[i]];

            }

            return copia;

        }


        // 5. PREPARAR LAS PREGUNTAS

        function prepararJuego() {

            preguntas = mezclar(elementos);

            numeroPregunta = 0;

            puntos = 0;

            mostrarPregunta();

        }


        // 6. MOSTRAR UNA PREGUNTA

        function mostrarPregunta() {

            let elemento = preguntas[numeroPregunta];

            let preguntarSimbolo = Math.random() < 0.5;

            let pregunta;

            if (preguntarSimbolo) {

                pregunta = "¿Cuál es el símbolo de " + elemento[0] + "?";

                respuestaCorrecta = elemento[1];

            } else {

                pregunta = "¿Qué elemento tiene el símbolo " + elemento[1] + "?";

                respuestaCorrecta = elemento[0];

            }

            buscar("pregunta").textContent = pregunta;

            buscar("resultado").textContent = "";

            buscar("siguiente").disabled = true;

            buscar("numero").textContent = numeroPregunta + 1;

            buscar("puntos").textContent = puntos;

            buscar("opciones").innerHTML = "";


            // Crear cuatro respuestas

            let otrasRespuestas = mezclar(

                elementos.filter(e => e !== elemento)

            ).slice(0, 3);


            let opciones = [elemento, ...otrasRespuestas];


            opciones = mezclar(opciones);


            opciones.forEach(function(e) {

                let respuesta = preguntarSimbolo ? e[1] : e[0];

                let boton = document.createElement("button");

                boton.textContent = respuesta;

                boton.onclick = function() {

                    comprobarRespuesta(respuesta);

                };

                buscar("opciones").appendChild(boton);

            });


            actualizarPrecision();

        }


        // 7. COMPROBAR LA RESPUESTA

        function comprobarRespuesta(respuesta) {

            let botones = buscar("opciones").children;

            for (let boton of botones) {

                boton.disabled = true;

            }

            if (respuesta === respuestaCorrecta) {

                puntos++;

                buscar("resultado").textContent = "¡Correcto! 🎉";

            } else {

                buscar("resultado").textContent =
                    "Incorrecto. La respuesta era: " + respuestaCorrecta;

            }

            buscar("puntos").textContent = puntos;

            buscar("siguiente").disabled = false;

            actualizarPrecision();

        }


        // 8. CALCULAR LA PRECISIÓN

        function actualizarPrecision() {

            let respondidas = numeroPregunta;

            if (buscar("siguiente").disabled === false) {

                respondidas++;

            }

            let precision = 0;

            if (respondidas > 0) {

                precision = Math.round(
                    (puntos / respondidas) * 100
                );

            }

            buscar("precision").textContent = precision;

        }


        // 9. SIGUIENTE PREGUNTA

        function siguientePregunta() {

            numeroPregunta++;

            if (numeroPregunta < preguntas.length) {

                mostrarPregunta();

            } else {

                terminarJuego();

            }

        }


        // 10. TERMINAR EL JUEGO

        function terminarJuego() {

            buscar("pregunta").textContent = "¡Cuestionario terminado!";

            buscar("opciones").innerHTML = "";

            buscar("resultado").textContent =
                "Conseguiste " + puntos + " puntos de 118.";

            buscar("siguiente").disabled = true;

            let record = Number(
                localStorage.getItem("mejorPuntuacion") || 0
            );

            if (puntos > record) {

                record = puntos;

                localStorage.setItem("mejorPuntuacion", record);

            }

            buscar("record").textContent = record;

        }


        // 11. REINICIAR EL JUEGO

        function reiniciar() {

            prepararJuego();

        }





        // 13. INICIAR EL JUEGO

        prepararJuego();


    </script>
